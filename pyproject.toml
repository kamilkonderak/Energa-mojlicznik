[project]
name = "energa-mojlicznik"
version = "0.2.0"
authors = [{name = "Andrzej Rabiczko", email = "arabiczko@gmail.com"}]
description = "Reads energy meter data from Energa MojLicznik page https://mojlicznik.energa-operator.pl"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=6.1.1",
    "paho-mqtt>=2.1.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "ruff",
    "mypy",
    "mypy-extensions",
    "pytest",
    "pytest-cov",
    "pluggy"
]

[tool.ruff]
line-length = 112
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort

[tool.mypy]
strict = true

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 50         # requires  min. 50% coverage to pass
skip_empty = true       # skip files with no statements
skip_covered = true     # skip files with 100% coverage
